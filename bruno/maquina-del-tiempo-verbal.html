<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Máquina del Tiempo Verbal · Bruno</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap');
:root{--ink:#29223d;--paper:#fffdf7;--muted:#6c6480;--purple:#7251b5;--deep:#49327f;--pink:#e45b91;--cyan:#39b8c8;--gold:#f5bb3b;--green:#2b9a62;--red:#d94e55;--shadow:#29223d33}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 15%,#ffd76b99,transparent 28%),radial-gradient(circle at 88% 20%,#66d4da77,transparent 30%),linear-gradient(155deg,#6a51aa,#3d2b73 60%,#25204f);overflow-x:hidden}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #ffe06d;outline-offset:3px}
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.clock-f{position:absolute;top:-60px;opacity:.25;animation:drift linear infinite}@keyframes drift{to{transform:translateY(112vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;width:min(760px,calc(100% - 24px));margin:auto;padding:18px 0 42px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fffdf7f5;border:3px solid var(--ink);border-radius:23px;padding:11px 14px;box-shadow:0 7px 0 var(--shadow);margin-bottom:17px}.brand{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:800;color:var(--deep);line-height:1.03}.brand .logo{font-size:1.9rem}.brand small{display:block;color:var(--pink);font:600 .72rem 'Fredoka'}.hud{display:flex;gap:6px}.chip{display:flex;gap:4px;align-items:center;background:white;border:2.5px solid var(--ink);border-radius:13px;padding:5px 8px;box-shadow:0 3px 0 #cfc4d5;font-size:.9rem}
.panel,.trail{background:#fffdf7f7;border:3px solid var(--ink);box-shadow:0 8px 0 var(--shadow)}.panel{border-radius:27px;padding:clamp(18px,5vw,33px)}.hero,.win{text-align:center}.mascot{font-size:4.6rem;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 5px 0 #0002)}@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}h1,h2{font-family:'Baloo 2';line-height:1.05}h1{font-size:clamp(2rem,8vw,3.2rem);color:var(--deep);margin:5px 0}h2{color:var(--deep);font-size:1.55rem;margin:23px 0 8px}.sub{color:var(--muted);font-size:1.08rem;line-height:1.4;max-width:580px;margin:0 auto 15px}.small{font-size:.87rem;color:var(--muted);line-height:1.35}
.eras{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:18px auto;max-width:610px}.era{border:2.5px solid var(--ink);border-radius:15px;padding:11px 6px;font-weight:700;box-shadow:0 3px 0 #cfc4d5;background:white}.era .e{font-size:1.45rem;display:block}.era.pps{background:#fff0c8}.era.imp{background:#dff6f6}
.play,.ghost,.help-btn,.choice,.next{border:3px solid var(--ink);border-radius:16px;font-family:'Baloo 2';font-weight:800;box-shadow:0 5px 0 var(--shadow);transition:.12s}.play{padding:12px 24px;background:linear-gradient(#8c65d0,#65429f);color:white;font-size:1.18rem}.ghost{padding:9px 15px;background:white;color:var(--deep);margin-top:10px}.play:hover,.ghost:hover,.help-btn:hover,.choice:hover,.next:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--shadow)}
.trail{display:flex;align-items:center;gap:9px;border-radius:18px;padding:9px 12px;margin-bottom:13px}.lab{font-size:.82rem;font-weight:700;white-space:nowrap}.track{position:relative;flex:1;height:13px;border:2px solid var(--ink);border-radius:10px;background:#ddd8e3}.fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:.4s}.walker{position:absolute;top:50%;transform:translate(-50%,-56%);font-size:1.4rem;transition:.4s}.tab{display:inline-block;border:2.5px solid var(--ink);border-radius:12px;background:var(--purple);color:white;padding:5px 12px;font-weight:700;box-shadow:0 3px 0 #c3b8ca}.qtag{text-align:center;text-transform:uppercase;letter-spacing:.08em;color:var(--pink);font-size:.82rem;font-weight:700;margin-top:8px}.prompt{text-align:center;font-family:'Baloo 2';font-size:clamp(1.25rem,4.5vw,1.68rem);font-weight:700;line-height:1.25;margin:10px auto;max-width:620px}.scenario{background:#f5f0ff;border:2.5px dashed var(--purple);border-radius:17px;padding:14px;text-align:center;font-size:1.1rem;line-height:1.5;margin:12px auto;max-width:610px}.scenario b{color:var(--deep);background:#ffeaa3;padding:1px 4px;border-radius:5px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.choice{display:flex;align-items:center;gap:10px;min-height:66px;padding:10px 12px;background:white;color:var(--ink);font-family:'Fredoka';font-size:1rem;text-align:left}.choice .em{font-size:1.5rem;min-width:30px;text-align:center}.choice.correct{background:#dff6e8;border-color:var(--green);color:#17633d}.choice.wrong{background:#ffe1e2;border-color:var(--red);color:#8f2930}.choice.dim{opacity:.48}.choice:disabled{cursor:default}
.help-zone{text-align:center;margin-top:14px}.help-btn{background:var(--gold);color:var(--ink);padding:8px 17px}.help-card{display:none;text-align:left;background:#fff5c9;border:2.5px solid #9a6a0a;border-radius:15px;padding:11px 13px;margin:10px auto 0;max-width:600px;line-height:1.4}.help-card.show{display:block;animation:appear .2s}.timeline{display:flex;align-items:center;gap:5px;margin:9px 0 3px}.timeline span{flex:1;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:6px 3px;background:white;font-size:.82rem}.timeline i{font-style:normal;font-weight:800}@keyframes appear{from{opacity:0;transform:translateY(-5px)}}
.feedback{display:none;align-items:center;gap:11px;border:3px solid var(--ink);border-radius:18px;padding:12px;margin-top:15px}.feedback.show{display:flex}.feedback.ok{background:#dff6e8;color:#17633d}.feedback.no{background:#ffe3e3;color:#8f2930}.feedback .face{font-size:2rem}.feedback .txt{flex:1;line-height:1.35}.feedback .ex{display:block;color:var(--ink);font-size:.88rem;margin-top:5px}.next{background:var(--purple);color:white;padding:8px 13px;white-space:nowrap}
.learn{text-align:left}.learn p,.learn li{line-height:1.5}.box{border:2.5px solid var(--ink);border-radius:17px;padding:14px;margin:11px 0;background:white;box-shadow:0 3px 0 #d8ccda}.box.pps{background:#fff0c8}.box.imp{background:#dff6f6}.bt{font-family:'Baloo 2';font-weight:800;color:var(--deep);font-size:1.12rem}.example{background:white;border:2px dashed var(--purple);border-radius:11px;padding:9px;margin-top:8px;text-align:center}.verb{font-weight:800;color:var(--deep);text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:3px}.row-btns{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:17px}.medal{font-size:4.5rem}.stars{font-size:2rem;letter-spacing:4px}.badges{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:11px}.badge{border:2px solid var(--ink);border-radius:12px;background:#f0e5ff;padding:7px 10px;font-size:.85rem;font-weight:600}.back{display:inline-block;margin-top:18px;color:white;font-weight:700;text-decoration:none}.back:hover{text-decoration:underline}.conf{position:fixed;top:-15px;width:11px;height:17px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:560px){.wrap{width:calc(100% - 16px);padding-top:9px}header{padding:9px;border-radius:18px}.brand{font-size:.84rem}.brand .logo{font-size:1.45rem}.chip{font-size:.78rem;padding:4px 6px}.panel{padding:18px 13px;border-radius:22px}.eras{grid-template-columns:1fr}.era{padding:8px}.era .e{display:inline;margin-right:5px}.choices{grid-template-columns:1fr}.lab:last-child{display:none}.feedback.show{align-items:flex-start;flex-wrap:wrap}.next{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true"></div>
<main class="wrap">
<header><div class="brand"><span class="logo">⏳</span><span>Máquina del<br>Tiempo Verbal<small>Los tiempos del pasado</small></span></div><div class="hud"><div class="chip">⏱️ <b id="hScore">0</b></div><div class="chip">🔥 <b id="hStreak">0</b></div><div class="chip">❤️ <b id="hLives">3</b></div></div></header>
<div id="app"></div>
<p style="text-align:center"><a class="back" href="index.html">← Volver a los juegos</a></p>
</main>
<script>
/* =====================================================
   LA MÁQUINA DEL TIEMPO VERBAL — Lengua (4° grado)
   Pretérito perfecto simple e imperfecto.
   ===================================================== */
const app=document.getElementById('app');
const hud={score:document.getElementById('hScore'),streak:document.getElementById('hStreak'),lives:document.getElementById('hLives')};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=rnd(0,i);[r[i],r[j]]=[r[j],r[i]];}return r};
const TOTAL=10;
const state={score:0,streak:0,best:0,lives:3,q:0,correct:0,help:0,topics:new Set(),deck:[]};
let current=null,helpLevel=0;

(function(){const s=document.getElementById('scene');for(let i=0;i<10;i++){const d=document.createElement('div');d.className='clock-f';d.textContent=pick(['⏰','⌛','🕰️','✨']);d.style.left=rnd(2,96)+'vw';d.style.fontSize=rnd(17,31)+'px';d.style.animationDuration=rnd(11,20)+'s';d.style.animationDelay=(-rnd(0,18))+'s';s.appendChild(d)}})();
function burst(n=25){const cols=['#7251b5','#e45b91','#39b8c8','#f5bb3b','#53bd7d'];for(let i=0;i<n;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=pick(cols);document.body.appendChild(c);c.animate([{top:'-15px',opacity:1},{top:'104vh',opacity:.9,transform:`translateX(${(Math.random()-.5)*220}px) rotate(${Math.random()*720}deg)`}],{duration:1100+Math.random()*700}).onfinish=()=>c.remove()}}
function syncHud(){hud.score.textContent=state.score;hud.streak.textContent=state.streak;hud.lives.textContent=state.lives}

const TENSES={
  pps:{name:'Pretérito perfecto simple',short:'Perfecto simple',em:'✅',desc:'una acción terminada en un momento del pasado',why:'La acción ocurrió y terminó en un momento pasado.'},
  imp:{name:'Pretérito imperfecto',short:'Imperfecto',em:'🔁',desc:'una acción que ocurría o se repetía en el pasado',why:'La acción duraba o se repetía, sin señalar su final.'}
};
const SUBJECTS=['Mora','Juan','Sofía','Tomás','La abuela','El maestro','Valentina','Bruno'];
const VERBS=[
 {inf:'jugar',pps:'jugó',imp:'jugaba',comps:['al fútbol','en la plaza','con sus amigos']},
 {inf:'llegar',pps:'llegó',imp:'llegaba',comps:['a la escuela','a su casa','al club']},
 {inf:'cocinar',pps:'cocinó',imp:'cocinaba',comps:['la cena','unas empanadas','una torta']},
 {inf:'leer',pps:'leyó',imp:'leía',comps:['un cuento','el libro','una historieta']},
 {inf:'terminar',pps:'terminó',imp:'terminaba',comps:['la tarea','el dibujo','su trabajo']},
 {inf:'escribir',pps:'escribió',imp:'escribía',comps:['una carta','un poema','la respuesta']},
 {inf:'hacer',pps:'hizo',imp:'hacía',comps:['la merienda','un experimento','los deberes']},
 {inf:'ver',pps:'vio',imp:'veía',comps:['esa película','el partido','un hornero']},
 {inf:'preparar',pps:'preparó',imp:'preparaba',comps:['la mochila','la comida','los materiales']},
 {inf:'ordenar',pps:'ordenó',imp:'ordenaba',comps:['su cuarto','los libros','la mesa']}
];
const leads={pps:['Ayer','El sábado','La semana pasada','Anoche'],imp:['Cuando era más chico','Todos los veranos','En aquella época','Mientras esperaba']};
const MARKERS={pps:['ayer','anoche','el sábado','la semana pasada'],imp:['todos los días','siempre','cuando era chico','cada verano']};
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function makeSentence(type,v=pick(VERBS),subject=pick(SUBJECTS)){
  const comp=pick(v.comps);
  if(type==='pps')return {html:`${pick(leads.pps)}, ${subject} <b>${v.pps}</b> ${comp}.`,plain:`${subject} ${v.pps} ${comp}`,verb:v.pps,v,subject,comp};
  return {html:`${pick(leads.imp)}, ${subject} <b>${v.imp}</b> ${comp}.`,plain:`${subject} ${v.imp} ${comp}`,verb:v.imp,v,subject,comp};
}
function tenseChoices(ok){return shuffle(Object.entries(TENSES).map(([k,t])=>({label:t.name,em:t.em,ok:k===ok})))}
function guides(type,s){return [
  type==='pps'?'Buscá una acción terminada y una marca como «ayer», «anoche» o una fecha concreta.':'Buscá una acción habitual o en desarrollo: algo que ocurría o se repetía.',
  `El verbo «${s.verb}» está en ${TENSES[type].name.toLowerCase()}.`
]}

function genReconocer(){const type=pick(Object.keys(TENSES)),s=makeSentence(type);return {topic:'Reconocer',tag:'🔎 Detectar el tiempo',prompt:'¿En qué tiempo está el verbo destacado?',scenario:s.html,choices:tenseChoices(type),hint:'Leé toda la oración: las palabras que rodean al verbo dan pistas.',guides:guides(type,s),explain:`«${s.verb}» está en <b>${TENSES[type].name}</b>. ${TENSES[type].why}`}}
function genCompletar(){const type=pick(Object.keys(TENSES)),v=pick(VERBS),s=makeSentence(type,v);let text=s.html.replace(`<b>${s.verb}</b>`,'<b>________</b>');return {topic:'Completar',tag:'✍️ Completar la oración',prompt:`Elegí la forma de <b>${v.inf}</b> que completa correctamente.`,scenario:text,choices:shuffle([{label:v.pps,em:'✅',ok:type==='pps'},{label:v.imp,em:'🔁',ok:type==='imp'}]),hint:'Mirá si la acción terminó o si ocurría o se repetía.',guides:guides(type,s),explain:`La forma correcta es <b>${s.verb}</b>: ${TENSES[type].desc}.`}}
function genUso(){const type=pick(Object.keys(TENSES)),t=TENSES[type];const prompts=[`¿Qué tiempo indica <b>${t.desc}</b>?`,`Necesitás contar ${t.desc}. ¿Qué tiempo usás?`];return {topic:'Usos',tag:'🧠 ¿Cuándo se usa?',prompt:pick(prompts),choices:tenseChoices(type),hint:'Relacioná cada nombre con la forma en que presenta la acción.',guides:[type==='pps'?'Pensá: ocurrió y terminó.':'Pensá: ocurría muchas veces o estaba sucediendo.',`La respuesta es ${t.name}.`],explain:`El <b>${t.name}</b> indica ${t.desc}.`}}
function genMarcadores(){const type=pick(Object.keys(TENSES)),right=pick(MARKERS[type]),other=type==='pps'?'imp':'pps';return {topic:'Pistas temporales',tag:'🗓️ Palabras que orientan',prompt:`¿Qué expresión suele acompañar al <b>${TENSES[type].name}</b>?`,choices:shuffle([{label:right,em:TENSES[type].em,ok:true},...shuffle(MARKERS[other]).slice(0,3).map(x=>({label:x,em:TENSES[other].em,ok:false}))]),hint:'Pensá si la expresión señala un momento terminado o una repetición.',guides:[type==='pps'?'Buscá una expresión que señale un momento concreto y terminado.':'Buscá una expresión que indique costumbre o repetición.',`«${right}» es una pista frecuente del ${TENSES[type].name.toLowerCase()}.`],explain:`«${right}» suele orientar hacia el <b>${TENSES[type].name}</b>.`}}
function genContraste(){const target=pick(Object.keys(TENSES)),other=target==='pps'?'imp':'pps',good=makeSentence(target),s2=makeSentence(other);return {topic:'Comparar',tag:'🧩 Comparar acciones',prompt:`¿Cuál oración expresa <b>${TENSES[target].desc}</b>?`,choices:shuffle([{label:good.html.replaceAll('<b>','').replaceAll('</b>',''),em:TENSES[target].em,ok:true},{label:s2.html.replaceAll('<b>','').replaceAll('</b>',''),em:TENSES[other].em,ok:false}]),hint:'No mires solamente el verbo: fijate cómo se presenta la acción pasada.',guides:guides(target,good),explain:`La oración correcta usa el <b>${TENSES[target].name}</b>: ${TENSES[target].why}`}}
const GENERATORS=[genReconocer,genCompletar,genUso,genMarcadores,genContraste];
function makeDeck(){return shuffle([...GENERATORS,...GENERATORS])}
function nextExercise(){return state.deck[state.q]()}

function showStart(){app.innerHTML=`<section class="panel hero"><div class="mascot">🧙‍♀️</div><h1>La Máquina del Tiempo Verbal</h1><p class="sub">Viajá por el pasado y aprendé a distinguir dos tiempos verbales.</p><div class="eras"><div class="era pps"><span class="e">✅</span>Perfecto simple<small class="small" style="display:block">acción terminada</small></div><div class="era imp"><span class="e">🔁</span>Imperfecto<small class="small" style="display:block">acción que ocurría</small></div></div><button class="play" onclick="startGame()">¡Activar la máquina! ⏳</button><div><button class="ghost" onclick="showLearn()">📖 Antes, quiero repasar</button></div><p class="small" style="margin-top:14px">10 viajes · 3 vidas ❤️ · pistas disponibles en cada desafío 💡</p></section>`}
function showLearn(){app.innerHTML=`<section class="panel learn"><div class="tab">📖 Guía para viajar al pasado</div><h1 style="font-size:2.1rem;text-align:center">Dos formas de contar el pasado</h1><div class="box pps"><div class="bt">✅ Pretérito perfecto simple</div><p>Indica una <b>acción terminada</b> en un momento del pasado.</p><div class="example">Ayer <span class="verb">llegué</span> a la escuela.<br>Juan <span class="verb">jugó</span> al fútbol.</div></div><div class="box imp"><div class="bt">🔁 Pretérito imperfecto</div><p>Indica una acción que <b>ocurría o se repetía</b> en el pasado, sin señalarla como terminada.</p><div class="example">Cuando era pequeño, <span class="verb">jugaba</span> en la plaza.<br>La abuela <span class="verb">cocinaba</span> mientras yo <span class="verb">leía</span>.</div></div><div class="box"><div class="bt">🔑 Preguntas que ayudan</div><ul><li>¿La acción ocurrió y terminó? → perfecto simple.</li><li>¿Ocurría, duraba o se repetía? → imperfecto.</li></ul></div><div class="row-btns"><button class="play" onclick="startGame()">⏳ ¡Empezar el viaje!</button><button class="ghost" onclick="showStart()">⬅ Volver</button></div></section>`;window.scrollTo({top:0,behavior:'smooth'})}
function startGame(){Object.assign(state,{score:0,streak:0,best:0,lives:3,q:0,correct:0,help:0,topics:new Set(),deck:makeDeck()});syncHud();loadNext();window.scrollTo({top:0,behavior:'smooth'})}
function loadNext(){if(state.q>=TOTAL||state.lives<=0){showWin();return}current=nextExercise();state.q++;helpLevel=0;render(current)}
function render(ex){const pct=Math.round((state.q-1)/TOTAL*100);app.innerHTML=`<div class="trail"><span class="lab">⏳ Viaje ${state.q}/${TOTAL}</span><div class="track"><div class="fill" style="width:${pct}%"></div><span class="walker" style="left:${pct}%">🕰️</span></div><span class="lab">${state.streak>1?'🔥 x'+state.streak:'Pasado'}</span></div><section class="panel"><div class="tab">${ex.tag}</div><div class="qtag">Desafío temporal</div><div class="prompt">${ex.prompt}</div>${ex.scenario?`<div class="scenario">${ex.scenario}</div>`:''}<p class="small" style="text-align:center">💭 ${ex.hint}</p><div class="choices" id="choices">${ex.choices.map((c,i)=>`<button class="choice" onclick="answer(${i})"><span class="em">${c.em||'📝'}</span><span>${c.label}</span></button>`).join('')}</div><div class="help-zone"><button class="help-btn" id="helpBtn" onclick="showHelp()">💡 Necesito una pista</button><div class="help-card" id="helpCard" aria-live="polite"></div></div><div class="feedback" id="fb" aria-live="polite"></div></section>`}
function showHelp(){if(helpLevel<current.guides.length){helpLevel++;state.help++}const card=document.getElementById('helpCard');card.className='help-card show';card.innerHTML=`<b>💡 Pista ${helpLevel}:</b> ${current.guides[helpLevel-1]}`;const btn=document.getElementById('helpBtn');btn.textContent=helpLevel<current.guides.length?'💡 Otra pista':'✅ Pistas completas';btn.disabled=helpLevel>=current.guides.length}
function reward(ok){if(ok){state.correct++;state.streak++;if(state.streak>state.best)state.best=state.streak;state.score+=10+(state.streak>=3?10:state.streak>=2?5:0);burst(state.streak>=3?38:23)}else{state.streak=0;state.lives--}syncHud()}
function answer(i){const ok=current.choices[i].ok;document.querySelectorAll('#choices .choice').forEach((b,j)=>{b.disabled=true;if(current.choices[j].ok)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dim')});if(ok)state.topics.add(current.topic);reward(ok);document.getElementById('helpBtn').disabled=true;const last=state.q>=TOTAL||state.lives<=0;const fb=document.getElementById('fb');fb.className='feedback show '+(ok?'ok':'no');fb.innerHTML=`<span class="face">${ok?'⏰':'⌛'}</span><span class="txt"><b>${ok?pick(['¡Viaje correcto!','¡Tiempo verbal dominado!','¡Excelente, cronista!']):'Casi. Mirá la explicación antes de seguir.'}</b><span class="ex">📘 ${current.explain}</span></span><button class="next" onclick="loadNext()">${last?'🏁 Resultado':'Seguir →'}</button>`;fb.scrollIntoView({behavior:'smooth',block:'nearest'})}
function showWin(){const attempted=state.q||1,acc=Math.round(state.correct/attempted*100),won=state.lives>0,stars=acc>=90?3:acc>=60?2:1;const badges=[];if(state.topics.size>=4)badges.push('🧭 Explorador de tiempos');if(state.best>=3)badges.push('🔥 Racha temporal');if(state.help)badges.push('💡 Buen uso de pistas');else if(state.correct)badges.push('🧠 Viajero independiente');burst(58);app.innerHTML=`<section class="panel win"><div class="tab">🏁 Regreso al presente</div><div class="medal">${won?(stars===3?'🏆':'⏰'):'⌛'}</div><h1>${won?'¡Misión temporal cumplida!':'¡Buen viaje por el pasado!'}</h1><p class="sub">${won?'Aprendiste dos formas de contar acciones pasadas.':'Se terminaron las vidas, pero aprendiste en cada parada.'}</p><div class="stars">${'⭐'.repeat(stars)}${'·'.repeat(3-stars)}</div><div class="hud" style="justify-content:center;margin:13px 0"><div class="chip">⏱️ <b>${state.score}</b> pts</div><div class="chip">✅ <b>${state.correct}/${state.q}</b></div><div class="chip">🔥 <b>${state.best}</b></div></div><p class="small">Precisión: ${acc}% · pistas usadas: ${state.help}</p><div class="badges">${badges.map(b=>`<div class="badge">${b}</div>`).join('')}</div><div class="row-btns"><button class="play" onclick="startGame()">🔄 Viajar otra vez</button><button class="ghost" onclick="showLearn()">📖 Repasar</button></div></section>`}
showStart();
</script>
</body>
</html>
